name: Service Build & Deploy

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write
  deployments: write

env:
  NODE_VERSION: '20'
  REGION: ${{ vars.CLOUD_RUN_REGION }}
  REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE_NAME }}

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.BACKEND_TEST_DATABASE_URL != '' && secrets.BACKEND_TEST_DATABASE_URL || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Backend
        uses: ./.github/actions/setup-backend
        with:
          working-directory: server
          node-version: ${{ env.NODE_VERSION }}

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcloud-auth
        with:
          workload-identity-provider: ${{ secrets.GCP_SERVICE_WORKLOAD_ID_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_SERVICE_ACCOUNT }}
          project-id: ${{ vars.GCP_PROJECT_ID }}

      - name: Download Cloud SQL Proxy
        id: proxy
        run: |
          curl -sSL https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.10.2/cloud-sql-proxy.linux.amd64 -o cloud-sql-proxy
          chmod +x cloud-sql-proxy

      - name: Start Cloud SQL Proxy
        env:
          INSTANCE_CONNECTION: ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION }}
        run: |
          ./cloud-sql-proxy "$INSTANCE_CONNECTION" --address 127.0.0.1 --port 5432 --quitquitquit &
          echo $! > proxy.pid
          sleep 5

      - name: Prepare database url
        if: env.DATABASE_URL == ''
        run: |
          SECRET=$(gcloud secrets versions access latest --secret="${{ vars.PRISMA_STAGING_DB_SECRET }}")
          SECRET=$(echo "$SECRET" | tr -d '\r')
          printf 'DATABASE_URL=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Build
        working-directory: server
        run: npm run build

      - name: Stop Cloud SQL Proxy
        if: always()
        run: |
          if [[ -f proxy.pid ]]; then
            kill "$(cat proxy.pid)" || true
          fi

  deploy_staging:
    name: Deploy Staging
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://${{ vars.STAGING_SERVICE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcloud-auth
        with:
          workload-identity-provider: ${{ secrets.GCP_SERVICE_WORKLOAD_ID_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_SERVICE_ACCOUNT }}
          project-id: ${{ vars.GCP_PROJECT_ID }}

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          docker build -t "$IMAGE" -f server/Dockerfile server

      - name: Push image
        run: docker push "$IMAGE"

      - name: Generate environment variables file
        run: |
          CONFIG=$(gcloud secrets versions access latest --secret="${{ vars.SERVICE_STAGING_ENV_SECRET }}")
          printf '%s' "$CONFIG" | jq -c '.' > service-env.json
          
      - name: Exorcise the Ghost Secret
        run: |
          gcloud run services update estate-guide-staging \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --remove-secrets "DATABASE_URL" \
            --quiet

      - name: Deploy Cloud Run revision
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          ./scripts/cloud-run-deploy.sh \
            --service "${{ env.SERVICE_NAME }}" \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --project "$GCP_PROJECT_ID" \
            --env-vars-file service-env.json \
            --set-secrets "${{ vars.SERVICE_STAGING_SECRET_REFS }}" \
            --allow-unauthenticated

  deploy_production:
    name: Deploy Production
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.PRODUCTION_SERVICE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcloud-auth
        with:
          workload-identity-provider: ${{ secrets.GCP_SERVICE_WORKLOAD_ID_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_SERVICE_ACCOUNT }}
          project-id: ${{ vars.GCP_PROJECT_ID }}

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          docker build -t "$IMAGE" -f server/Dockerfile server

      - name: Push image
        run: docker push "$IMAGE"

      - name: Generate environment variables file
        run: |
          CONFIG=$(gcloud secrets versions access latest --secret="${{ vars.SERVICE_PROD_ENV_SECRET }}")
          printf '%s' "$CONFIG" | jq -c '.' > service-env.json

      - name: Deploy Cloud Run revision
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          ./scripts/cloud-run-deploy.sh \
            --service "${{ env.SERVICE_NAME }}" \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --project "$GCP_PROJECT_ID" \
            --env-vars-file service-env.json \
            --set-secrets "${{ vars.SERVICE_PROD_SECRET_REFS }}" \
            --allow-unauthenticated
