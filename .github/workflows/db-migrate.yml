name: Infrastructure & Database

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        options:
          - staging
          - production
      apply:
        description: Apply Terraform & Prisma changes (set to false for plan only)
        type: boolean
        default: false
      run-prisma:
        description: Run prisma migrate deploy after Terraform apply
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  deployments: write

env:
  TF_WORKING_DIR: infrastructure/terraform

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    outputs:
      plan-path: ${{ steps.plan.outputs.plan-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcloud-auth
        with:
          workload-identity-provider: ${{ secrets.GCP_INFRA_WORKLOAD_ID_PROVIDER }}
          service-account: ${{ secrets.GCP_INFRA_SERVICE_ACCOUNT }}
          project-id: ${{ vars.GCP_PROJECT_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.6

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          PLAN_FILE="tfplan-${{ github.run_id }}-${{ github.event.inputs.environment }}"
          terraform plan \
            -var-file="env/${{ github.event.inputs.environment }}.tfvars" \
            -out "$PLAN_FILE"
          echo "plan-path=$PLAN_FILE" >> $GITHUB_OUTPUT

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.event.inputs.environment }}
          path: ${{ env.TF_WORKING_DIR }}/${{ steps.plan.outputs.plan-path }}
          retention-days: 5

  apply:
    name: Terraform Apply & Prisma Migrate
    needs: plan
    if: github.event.inputs.apply == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcloud-auth
        with:
          workload-identity-provider: ${{ secrets.GCP_INFRA_WORKLOAD_ID_PROVIDER }}
          service-account: ${{ secrets.GCP_INFRA_SERVICE_ACCOUNT }}
          project-id: ${{ vars.GCP_PROJECT_ID }}

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.event.inputs.environment }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.6

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply "${{ needs.plan.outputs.plan-path }}"

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh

      - name: Download Cloud SQL Proxy
        run: |
          curl -sSL https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.10.2/cloud-sql-proxy.linux.amd64 -o cloud-sql-proxy
          chmod +x cloud-sql-proxy

      - name: Start Cloud SQL Proxy
        env:
          INSTANCE_CONNECTION: ${{ github.event.inputs.environment == 'production' && vars.CLOUD_SQL_INSTANCE_CONNECTION_PROD || vars.CLOUD_SQL_INSTANCE_CONNECTION }}
        run: |
          ./cloud-sql-proxy "$INSTANCE_CONNECTION" --address 127.0.0.1 --port 5432 --quitquitquit &
          echo $! > proxy.pid
          sleep 5

      - name: Download database secret
        env:
          SECRET_NAME: ${{ github.event.inputs.environment == 'production' && vars.PRISMA_PROD_DB_SECRET || vars.PRISMA_STAGING_DB_SECRET }}
        run: |
          gcloud secrets versions access latest --secret="$SECRET_NAME" > db-url.txt

      - name: Prisma Migrate Deploy
        if: github.event.inputs['run-prisma'] == 'true'
        run: ./scripts/prisma-migrate.sh --database-url-file db-url.txt

      - name: Stop Cloud SQL Proxy
        if: always()
        run: |
          if [[ -f proxy.pid ]]; then
            kill "$(cat proxy.pid)" || true
          fi
