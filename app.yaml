runtime: nodejs20

instance_class: F1

handlers:
  - url: /assets
    static_dir: dist/assets
    secure: always
  
  - url: /(.+\.(ico|png|jpg|jpeg|svg|webp|gif))$
    static_files: dist/\1
    upload: dist/(.+\.(ico|png|jpg|jpeg|svg|webp|gif))$
    secure: always
  
  - url: /.*
    static_files: dist/index.html
    upload: dist/index.html
    secure: always

env_variables:
  NODE_ENV: 'production'
