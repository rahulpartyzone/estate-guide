steps:
  # Install dependencies
  - name: 'node:20'
    entrypoint: npm
    args: ['install']
  
  # Build the application
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']
  
  # Deploy to App Engine
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['app', 'deploy', '--quiet', '--version=v1']

timeout: '1600s'
